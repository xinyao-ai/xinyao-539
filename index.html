<script>

  const WORKER_URL =
    "https://xinyao-539-api.love06130430.workers.dev/";


  const playType =
    document.getElementById("playType");

  const missArea =
    document.getElementById("missArea");

  const missCount =
    document.getElementById("missCount");

  const analyzeBtn =
    document.getElementById("analyzeBtn");

  const result =
    document.getElementById("result");


  /* =========================
     多選不中顆數
  ========================= */

  function updateMissArea() {

    if (playType.value === "多選不中") {
      missArea.classList.remove("hidden");
    } else {
      missArea.classList.add("hidden");
    }

  }

  playType.addEventListener(
    "change",
    updateMissArea
  );

  updateMissArea();


  /* =========================
     HTML 安全處理
  ========================= */

  function escapeHtml(text) {

    return String(text ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");

  }


  /* =========================
     計算下一個539分析日期
     星期日自動跳過
  ========================= */

  function getNextDrawDate(latestDate) {

    if (
      !latestDate ||
      !latestDate.includes("/")
    ) {
      return "";
    }

    const parts =
      latestDate.split("/");

    const month =
      parseInt(parts[0], 10);

    const day =
      parseInt(parts[1], 10);


    const year =
      parseInt(
        new Intl.DateTimeFormat(
          "en",
          {
            timeZone: "Asia/Taipei",
            year: "numeric"
          }
        ).format(new Date()),
        10
      );


    const date =
      new Date(
        Date.UTC(
          year,
          month - 1,
          day
        )
      );


    /* 至少往後一天 */
    do {

      date.setUTCDate(
        date.getUTCDate() + 1
      );

    } while (
      date.getUTCDay() === 0
    );


    const nextMonth =
      String(
        date.getUTCMonth() + 1
      ).padStart(2, "0");


    const nextDay =
      String(
        date.getUTCDate()
      ).padStart(2, "0");


    return (
      nextMonth +
      "/" +
      nextDay
    );

  }


  /* =========================
     執行分析
  ========================= */

  analyzeBtn.addEventListener(
    "click",
    async () => {

      result.classList.remove("error");
      result.classList.add("loading");

      analyzeBtn.disabled = true;

      analyzeBtn.textContent =
        "分析中...";

      result.textContent =
        "正在取得近期539最新開獎資料...\n正在套用抓牌板路與趨勢分析...";


      try {

        const response =
          await fetch(
            WORKER_URL,
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify({

                  play_type:
                    playType.value,

                  miss_count:
                    playType.value ===
                    "多選不中"
                      ? missCount.value
                      : "5顆"

                })
            }
          );


        const data =
          await response.json();


        if (!response.ok) {

          throw new Error(
            data?.error ||
            "分析失敗"
          );

        }


        if (!data.result) {

          throw new Error(
            "沒有取得分析結果"
          );

        }


        result.classList.remove(
          "loading"
        );


        const latestDate =
          data.latest_date ||
          "未知";


        const latestNumbers =
          data.latest_numbers ||
          "未知";


        const targetDate =
          getNextDrawDate(
            latestDate
          );


        let analysisText =
          data.result;


        /* =========================
           把日期加到分析標題前
        ========================= */

        if (
          analysisText.startsWith("【")
        ) {

          analysisText =
            targetDate +
            analysisText;

        } else {

          analysisText =
            targetDate +
            "\n" +
            analysisText;

        }


        /* =========================
           顯示結果
        ========================= */

        result.innerHTML =
          '<div class="data-info">' +

            '<div class="data-row">' +
              '📅 資料基準：<strong>' +
              escapeHtml(latestDate) +
              '</strong>' +
            '</div>' +

            '<div class="data-row">' +
              '🎱 最新開獎：<strong>' +
              escapeHtml(latestNumbers) +
              '</strong>' +
            '</div>' +

            '<div class="data-row">' +
              '🎯 分析目標：<strong>下一期</strong>' +
            '</div>' +

          '</div>' +

          '<div class="analysis-output">' +
            escapeHtml(analysisText) +
          '</div>';


      } catch (error) {

        console.error(error);

        result.classList.remove(
          "loading"
        );

        result.classList.add(
          "error"
        );

        result.textContent =
          "分析發生錯誤\n\n" +
          error.message +
          "\n\n請稍後再試一次。";


      } finally {

        analyzeBtn.disabled = false;

        analyzeBtn.textContent =
          "開始分析";

      }

    }
  );

</script>
