<!-- =========================
     頂部
========================== -->

<section class="header">

  <div class="logo">
    <img
      src="./icon-192.png"
      onerror="this.onerror=null; this.src='./icon-512.png';"
      alt="芯瑤539趨勢分析"
      class="logo-img"
    />
  </div>

  <h1>芯瑤💕539趨勢分析</h1>

  <div class="sub">
    依照個人抓牌板路與歷史趨勢進行系統化分析
  </div>

</section>


<!-- =========================
     玩法選擇
========================== -->

<section class="card">

  <label for="playType">
    選擇分析玩法
  </label>

  <select id="playType">
    <option value="連碰234星">連碰234星</option>
    <option value="全車">全車</option>
    <option value="尾數">尾數</option>
    <option value="多選不中">多選不中</option>
  </select>


  <div id="missArea" class="hidden">

    <label for="missCount">
      多選不中顆數
    </label>

    <select id="missCount">
      <option value="5顆">5顆</option>
      <option value="6顆">6顆</option>
      <option value="7顆">7顆</option>
      <option value="8顆">8顆</option>
      <option value="9顆">9顆</option>
      <option value="10顆">10顆</option>
    </select>

  </div>


  <button id="analyzeBtn">
    開始分析
  </button>

</section>


<!-- =========================
     分析結果
========================== -->

<section class="card">

  <div class="result-title">
    分析結果
  </div>

  <div id="result" class="result">
    請先選擇玩法並點擊「開始分析」
  </div>

</section>


<div class="footer">
  本工具為趨勢資料分析參考
</div>
