<!DOCTYPE html>
<html lang="zh-Hant">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>
    芯瑤💕539趨勢分析
  </title>

  <link
    rel="icon"
    href="./favicon-64.png"
  >

  <link
    rel="apple-touch-icon"
    href="./icon-192(1).png"
  >

  <meta
    name="theme-color"
    content="#FFF1CE"
  >


  <style>

    :root {

      --orange:
        #F59A32;

      --orange-dark:
        #DF771C;

      --gold:
        #FFC84F;

      --yellow:
        #FFE59A;

      --cream:
        #FFF8E7;

      --cream2:
        #FFF1CF;

      --brown:
        #543B29;

      --soft-brown:
        #87694F;

      --white:
        #FFFFFF;

    }


    * {
      box-sizing:
        border-box;
    }


    html,
    body {

      margin: 0;

      padding: 0;

      min-height:
        100%;

    }


    body {

      min-height:
        100vh;

      overflow-x:
        hidden;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans TC",
        sans-serif;

      color:
        var(--brown);

      background:
        radial-gradient(
          circle at 15% 10%,
          rgba(
            255,
            209,
            93,
            0.45
          ),
          transparent 27%
        ),

        radial-gradient(
          circle at 90% 30%,
          rgba(
            245,
            154,
            50,
            0.20
          ),
          transparent 30%
        ),

        linear-gradient(
          180deg,
          #FFF7E4,
          #FFEDC8 50%,
          #FFF9EB
        );

    }


    button,
    input,
    select {

      font-family:
        inherit;

    }


    .hidden {

      display:
        none !important;

    }


    /* ====================================
       背景動畫
    ==================================== */

    .background-effects {

      position:
        fixed;

      inset: 0;

      z-index: 0;

      pointer-events:
        none;

      overflow:
        hidden;

    }


    .bg-orb {

      position:
        absolute;

      border-radius:
        50%;

      filter:
        blur(10px);

      opacity:
        0.55;

    }


    .orb1 {

      width:
        230px;

      height:
        230px;

      left:
        -90px;

      top:
        -50px;

      background:
        rgba(
          255,
          201,
          72,
          0.38
        );

      animation:
        orbFloat1
        8s
        ease-in-out
        infinite alternate;

    }


    .orb2 {

      width:
        280px;

      height:
        280px;

      right:
        -130px;

      top:
        45%;

      background:
        rgba(
          241,
          145,
          45,
          0.19
        );

      animation:
        orbFloat2
        10s
        ease-in-out
        infinite alternate;

    }


    @keyframes orbFloat1 {

      to {

        transform:
          translate(
            35px,
            45px
          );

      }

    }


    @keyframes orbFloat2 {

      to {

        transform:
          translate(
            -40px,
            30px
          );

      }

    }


    .spark {

      position:
        absolute;

      width:
        6px;

      height:
        6px;

      border-radius:
        50%;

      background:
        #FFD064;

      box-shadow:
        0 0 15px
        rgba(
          255,
          187,
          43,
          0.65
        );

      animation:
        sparkFloat
        5s
        ease-in-out
        infinite;

    }


    .spark:nth-child(3) {

      left: 8%;
      top: 22%;

    }


    .spark:nth-child(4) {

      right: 12%;
      top: 15%;

      animation-delay:
        1s;

    }


    .spark:nth-child(5) {

      left: 18%;
      top: 75%;

      animation-delay:
        2s;

    }


    .spark:nth-child(6) {

      right: 10%;
      top: 70%;

      animation-delay:
        3s;

    }


    .spark:nth-child(7) {

      left: 52%;
      top: 8%;

      animation-delay:
        4s;

    }


    @keyframes sparkFloat {

      0%,
      100% {

        transform:
          translateY(0)
          scale(0.7);

        opacity:
          0.3;

      }


      50% {

        transform:
          translateY(-18px)
          scale(1.3);

        opacity:
          1;

      }

    }


    /* ====================================
       LOGIN
    ==================================== */

    #loginView {

      position:
        relative;

      z-index: 2;

      width:
        min(
          92%,
          430px
        );

      min-height:
        100vh;

      margin:
        auto;

      display:
        flex;

      align-items:
        center;

      justify-content:
        center;

      padding:
        35px 0;

    }


    .login-wrap {

      width:
        100%;

      text-align:
        center;

      animation:
        loginEnter
        0.8s
        cubic-bezier(
          .2,
          .9,
          .3,
          1
        )
        both;

    }


    @keyframes loginEnter {

      from {

        opacity:
          0;

        transform:
          translateY(25px)
          scale(0.96);

      }


      to {

        opacity:
          1;

        transform:
          translateY(0)
          scale(1);

      }

    }


    .login-logo-area {

      position:
        relative;

      display:
        inline-flex;

      align-items:
        center;

      justify-content:
        center;

      width:
        140px;

      height:
        140px;

      margin-bottom:
        8px;

    }


    .login-logo-glow {

      position:
        absolute;

      width:
        125px;

      height:
        125px;

      border-radius:
        38px;

      background:
        linear-gradient(
          135deg,
          rgba(
            255,
            221,
            116,
            .8
          ),
          rgba(
            244,
            150,
            45,
            .25
          )
        );

      filter:
        blur(9px);

      animation:
        pulseGlow
        2.5s
        ease-in-out
        infinite;

    }


    .login-logo {

      position:
        relative;

      z-index:
        3;

      width:
        104px;

      height:
        104px;

      object-fit:
        cover;

      border-radius:
        28px;

      border:
        3px solid
        white;

      box-shadow:
        0 15px 35px
        rgba(
          171,
          96,
          25,
          .22
        );

      animation:
        logoFloat
        3.2s
        ease-in-out
        infinite;

    }


    @keyframes logoFloat {

      0%,
      100% {

        transform:
          translateY(0);

      }


      50% {

        transform:
          translateY(-8px);

      }

    }


    @keyframes pulseGlow {

      0%,
      100% {

        transform:
          scale(.94);

        opacity:
          .45;

      }


      50% {

        transform:
          scale(1.08);

        opacity:
          .9;

      }

    }


    /* 漂浮539球 */

    .orbit-ball {

      position:
        absolute;

      display:
        flex;

      align-items:
        center;

      justify-content:
        center;

      width:
        34px;

      height:
        34px;

      border-radius:
        50%;

      color:
        white;

      font-size:
        12px;

      font-weight:
        900;

      background:
        radial-gradient(
          circle at 30% 25%,
          #FFE386,
          #F6A131 45%,
          #DF7317
        );

      border:
        2px solid
        rgba(
          255,
          255,
          255,
          .85
        );

      box-shadow:
        0 6px 13px
        rgba(
          204,
          104,
          19,
          .22
        );

    }


    .orbit-a {

      left:
        0;

      top:
        26px;

      animation:
        floatBallA
        3.5s
        ease-in-out
        infinite;

    }


    .orbit-b {

      right:
        0;

      top:
        15px;

      animation:
        floatBallB
        4s
        ease-in-out
        infinite;

    }


    .orbit-c {

      right:
        10px;

      bottom:
        9px;

      animation:
        floatBallA
        3.8s
        ease-in-out
        infinite reverse;

    }


    @keyframes floatBallA {

      50% {

        transform:
          translate(
            7px,
            -8px
          )
          rotate(10deg);

      }

    }


    @keyframes floatBallB {

      50% {

        transform:
          translate(
            -8px,
            8px
          )
          rotate(-12deg);

      }

    }


    .login-title {

      margin:
        4px 0 6px;

      font-size:
        25px;

      font-weight:
        900;

      color:
        #4C3627;

    }


    .login-title span {

      color:
        #EA8722;

    }


    .login-sub {

      margin-bottom:
        23px;

      color:
        #967457;

      font-size:
        13px;

    }


    .login-card {

      position:
        relative;

      overflow:
        hidden;

      padding:
        25px 22px;

      border-radius:
        27px;

      background:
        rgba(
          255,
          255,
          255,
          .91
        );

      border:
        1px solid
        rgba(
          255,
          203,
          110,
          .55
        );

      box-shadow:
        0 18px 45px
        rgba(
          161,
          99,
          30,
          .13
        );

      backdrop-filter:
        blur(15px);

      -webkit-backdrop-filter:
        blur(15px);

    }


    .login-card::before {

      content:
        "";

      position:
        absolute;

      width:
        170px;

      height:
        170px;

      right:
        -90px;

      top:
        -100px;

      border-radius:
        50%;

      background:
        rgba(
          255,
          207,
          92,
          .20
        );

    }


    .login-card-title {

      position:
        relative;

      margin-bottom:
        18px;

      text-align:
        left;

      font-size:
        17px;

      font-weight:
        900;

      color:
        #58402F;

    }


    .login-label {

      position:
        relative;

      display:
        block;

      margin-bottom:
        8px;

      text-align:
        left;

      color:
        #75573F;

      font-size:
        13px;

      font-weight:
        800;

    }


    .login-input-wrap {

      position:
        relative;

    }


    #memberAccount {

      position:
        relative;

      width:
        100%;

      height:
        55px;

      padding:
        0 47px 0 16px;

      outline:
        none;

      border:
        1px solid
        #EDD3A6;

      border-radius:
        16px;

      background:
        #FFFEFA;

      color:
        #503A2B;

      font-size:
        16px;

      transition:
        .2s;

    }


    #memberAccount:focus {

      border-color:
        #F3A348;

      box-shadow:
        0 0 0 4px
        rgba(
          243,
          163,
          72,
          .12
        );

    }


    .input-icon {

      position:
        absolute;

      right:
        16px;

      top:
        50%;

      transform:
        translateY(-50%);

      font-size:
        18px;

    }


    #loginBtn {

      position:
        relative;

      width:
        100%;

      height:
        55px;

      margin-top:
        16px;

      overflow:
        hidden;

      border:
        none;

      border-radius:
        17px;

      color:
        white;

      font-size:
        16px;

      font-weight:
        900;

      background:
        linear-gradient(
          110deg,
          #E77C1C,
          #F5A038,
          #FFC754
        );

      box-shadow:
        0 11px 25px
        rgba(
          220,
          117,
          23,
          .27
        );

      cursor:
        pointer;

    }


    #loginBtn::after {

      content:
        "";

      position:
        absolute;

      width:
        35%;

      height:
        200%;

      left:
        -60%;

      top:
        -50%;

      transform:
        rotate(20deg);

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(
            255,
            255,
            255,
            .7
          ),
          transparent
        );

      animation:
        shine
        2.8s
        ease-in-out
        infinite;

    }


    @keyframes shine {

      60%,
      100% {

        left:
          130%;

      }

    }


    #loginBtn:active {

      transform:
        scale(.985);

    }


    #loginBtn:disabled {

      opacity:
        .65;

    }


    .login-message {

      min-height:
        24px;

      padding-top:
        12px;

      color:
        #B65336;

      font-size:
        13px;

    }


    .login-message.success {

      color:
        #BA761E;

    }


    .login-success-animation {

      animation:
        loginLeave
        .45s
        ease
        forwards;

    }


    @keyframes loginLeave {

      to {

        opacity:
          0;

        transform:
          translateY(-12px)
          scale(.97);

      }

    }


    /* ====================================
       APP
    ==================================== */

    #appView {

      position:
        relative;

      z-index:
        2;

      width:
        min(
          92%,
          520px
        );

      margin:
        auto;

      padding:
        28px 0 60px;

      animation:
        appEnter
        .65s
        ease
        both;

    }


    @keyframes appEnter {

      from {

        opacity:
          0;

        transform:
          translateY(15px);

      }


      to {

        opacity:
          1;

        transform:
          translateY(0);

      }

    }


    .top-member {

      display:
        flex;

      justify-content:
        flex-end;

      align-items:
        center;

      gap:
        8px;

      margin-bottom:
        13px;

    }


    .member-chip {

      padding:

      border-radius:
        999px;

      background:
        rgba(
          255,
          255,
          255,
          .78
        );

      color:
        #866146;

      font-size:
        11px;

      box-shadow:
        0 6px 16px
        rgba(
          170,
          103,
          30,
          .08
        );

    }


    #logoutBtn {

      border:
        0;

      padding:
        7px 11px;

      border-radius:
        999px;

      background:
        #FFE6B4;

      color:
        #B26721;

      font-size:
        11px;

      font-weight:
        800;

      cursor:
        pointer;

    }


    .header {

      text-align:
        center;

      margin-bottom:
        25px;

    }


    .app-logo {

      width:
        96px;

      height:
        96px;

      object-fit:
        cover;

      border-radius:
        25px;

      border:
        3px solid
        white;

      box-shadow:
        0 12px 30px
        rgba(
          178,
          101,
          28,
          .18
        );

      animation:
        logoFloat
        3.4s
        ease-in-out
        infinite;

    }


    h1 {

      margin:
        10px 0 0;

      color:
        #4D3828;

      font-size:
        24px;

      font-weight:
        900;

    }


    .highlight {

      color:
        #E98522;

    }


    .sub {

      margin-top:
        8px;

      color:
        #977557;

      font-size:
        13px;

    }


    .mini-stars {

      margin-top:
        8px;

      color:
        #EFAF3C;

      letter-spacing:
        8px;

    }


    .card {

      position:
        relative;

      width:
        100%;

      padding:
        21px;

      margin-bottom:
        17px;

      overflow:
        hidden;

      border:
        1px solid
        rgba(
          255,
          202,
          111,
          .50
        );

      border-radius:
        24px;

      background:
        rgba(
          255,
          255,
          255,
          .91
        );

      box-shadow:
        0 13px 35px
        rgba(
          158,
          94,
          27,
          .10
        );

      backdrop-filter:
        blur(12px);

    }


    label {

      display:
        block;

      margin-bottom:
        8px;

      color:
        #5C4431;

      font-size:
        14px;

      font-weight:
        900;

    }


    select {

      width:
        100%;

      height:
        52px;

      padding:
        0 14px;

      border:
        1px solid
        #EED5A9;

      border-radius:
        15px;

      outline:
        none;

      background:
        white;

      color:
        #594333;

      font-size:
        16px;

    }


    #missArea {

      margin-top:
        17px;

    }


    #analyzeBtn {

      position:
        relative;

      width:
        100%;

      height:
        55px;

      margin-top:
        19px;

      overflow:
        hidden;

      border:
        0;

      border-radius:
        17px;

      color:
        white;

      font-size:
        17px;

      font-weight:
        900;

      background:
        linear-gradient(
          110deg,
          #E87C1D,
          #F5A13A,
          #FFCA58
        );

      box-shadow:
        0 10px 24px
        rgba(
          220,
          119,
          27,
          .27
        );

      cursor:
        pointer;

    }


    #analyzeBtn::after {

      content:
        "";

      position:
        absolute;

      top:
        -50%;

      left:
        -55%;

      width:
        35%;

      height:
        200%;

      transform:
        rotate(20deg);

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(
            255,
            255,
            255,
            .7
          ),
          transparent
        );

      animation:
        shine
        3s
        infinite;

    }


    .result-title {

      display:
        flex;

      gap:
        8px;

      align-items:
        center;

      margin-bottom:
        13px;

      font-size:
        17px;

      font-weight:
        900;

    }


    .result {

      padding:

      border-radius:
        18px;

      border:

          164,

      background:
        linear-gradient(

        center;

      color:

      font-size:
        13px;

    }


    .data-info {

      margin-bottom:

        both;

        opacity:

          translateY(8px);

      }

        flex;

      flex-wrap:
        wrap;

      gap:
        8px;

    }


    .number-ball {

      display:
        inline-flex;

      align-items:
        center;

      justify-content:
        center;

      width:
        48px;

      height:
        48px;

      border-radius:
        50%;

      border:
        2px solid
        rgba(
          255,
          255,
          255,
          .9
        );

      color:
        white;

      font-size:
        17px;

      font-weight:
        900;

      background:
        radial-gradient(
          circle at 30% 25%,
          #FFDE78,
          #F7AA35 40%,
          #E67819 80%
        );

      box-shadow:
        0 7px 15px
        rgba(
          207,
          100,
          15,
          .22
        );

      opacity:
        0;

      transform:
        translateY(14px)
        scale(.6);

      animation:
        ballPop
        .48s
        cubic-bezier(
          .22,
          1.35,
          .5,
          1
        )
        forwards;

    }


    .number-ball.small {

      width:
        40px;

      height:
        40px;

      color:
        #67451E;

      font-size:
        15px;

      background:
        radial-gradient(
          circle at 30% 25%,
          #FFF1AD,
          #FFCB5D,
          #EFA23A
        );

    }


    @keyframes ballPop {

      70% {

        opacity:
          1;

        transform:
          translateY(-4px)
          scale(1.08);

      }


      100% {

        opacity:
          1;

        transform:
          translateY(0)
          scale(1);

      }

    }


    .text-pill {

      display:
        inline-flex;

      padding:
        8px 13px;

      border-radius:
        999px;

      background:
        #FFF0C8;

      color:
        #D27119;

      font-weight:
        900;

    }


    .loading-wrap {

      text-align:
        center;

      padding:
        8px 0;

    }


    .loading-balls {

      display:
        flex;

      justify-content:
        center;

      gap:
        7px;

    }


    .loading-ball {

      width:
        15px;

      height:
        15px;

      border-radius:
        50%;

      background:
        linear-gradient(
          135deg,
          #FFC755,
          #E98221
        );

      animation:
        loadingBounce
        .9s
        ease-in-out
        infinite;

    }


    .loading-ball:nth-child(2) {

      animation-delay:
        .1s;

    }


    .loading-ball:nth-child(3) {

      animation-delay:
        .2s;

    }


    .loading-ball:nth-child(4) {

      animation-delay:
        .3s;

    }


    .loading-ball:nth-child(5) {

      animation-delay:
        .4s;

    }


    @keyframes loadingBounce {

      50% {

        transform:
          translateY(-9px);

      }

    }


    .loading-text {

      margin-top:
        10px;

      color:
        #997353;

      font-size:
        13px;

    }


    .error-box {

      white-space:
        pre-line;

      color:
        #B65336;

      font-size:
        13px;

    }


    .footer {

      margin-top:
        25px;

      text-align:
        center;

      color:
        #AA8768;

      font-size:
        11px;

    }


    @media (
      max-width: 480px
    ) {

      .card {

        padding:
          19px;

      }


      .number-ball {

        width:
          45px;

        height:
          45px;

      }


      .number-ball.small {

        width:
          38px;

        height:
          38px;

      }

    }

  </style>

</head>


<body>


  <div class="background-effects">

    <div class="bg-orb orb1"></div>

    <div class="bg-orb orb2"></div>

    <span class="spark"></span>
    <span class="spark"></span>
    <span class="spark"></span>
    <span class="spark"></span>
    <span class="spark"></span>

  </div>


  <!-- =====================================
       LOGIN VIEW
  ====================================== -->

  <section id="loginView">

    <div
      id="loginWrap"
      class="login-wrap"
    >


      <div class="login-logo-area">

        <div
          class="login-logo-glow"
        ></div>


        <span
          class="orbit-ball orbit-a"
        >
          05
        </span>


        <span
          class="orbit-ball orbit-b"
        >
          18
        </span>


        <span
          class="orbit-ball orbit-c"
        >
          27
        </span>


        <img
          src="./icon-192(1).png"
          onerror="this.onerror=null;this.src='./icon-512(1).png';"
          class="login-logo"
        >

      </div>


      <div class="login-title">

        芯瑤💕
        <span>
          539
        </span>

      </div>


      <div class="login-sub">
        趨勢分析會員系統
      </div>


      <div class="login-card">

        <div class="login-card-title">
          ✨ 會員登入
        </div>


        <form id="loginForm">

          <label
            class="login-label"
            for="memberAccount"
          >
            會員帳號
          </label>


          <div
            class="login-input-wrap"
          >

            <input
              id="memberAccount"
              type="text"
              autocomplete="username"
              placeholder="請輸入會員帳號"
            >

            <span class="input-icon">
              👤
            </span>

          </div>


          <button
            id="loginBtn"
            type="submit"
          >
            ✨ 登入分析系統
          </button>


          <div
            id="loginMessage"
            class="login-message"
          ></div>

        </form>

      </div>

    </div>

  </section>


  <!-- =====================================
       APP VIEW
  ====================================== -->

  <main
    id="appView"
    class="hidden"
  >


    <div class="top-member">

      <div
        id="memberChip"
        class="member-chip"
      >
        👤 會員
      </div>


      <button id="logoutBtn">
        登出
      </button>

    </div>


    <section class="header">

      <img
        src="./icon-192(1).png"
        onerror="this.onerror=null;this.src='./icon-512(1).png';"
        class="app-logo"
      >


      <h1>

        芯瑤💕
        <span class="highlight">
          539趨勢分析
        </span>

      </h1>


      <div class="sub">
        依照個人抓牌板路與歷史趨勢進行系統化分析
      </div>


      <div class="mini-stars">
        ✦ ✧ ✦
      </div>

    </section>


    <section class="card">

      <label for="playType">
        選擇分析玩法
      </label>


      <select id="playType">

        <option value="連碰234星">
          連碰234星
        </option>

        <option value="全車">
          全車
        </option>

        <option value="尾數">
          尾數
        </option>

        <option value="多選不中">
          多選不中
        </option>

      </select>


      <div
        id="missArea"
        class="hidden"
      >

        <label for="missCount">
          多選不中顆數
        </label>


        <select id="missCount">

          <option value="5顆">5顆</option>
          <option value="6顆">6顆</option>
          <option value="7顆">7顆</option>
          <option value="8顆">8顆</option>
          <option value="9顆">9顆</option>
          <option value="10顆">10顆</option>

        </select>

      </div>


      <button id="analyzeBtn">
        ✨ 開始分析
      </button>

    </section>


    <section class="card">

      <div class="result-title">
        🎱 分析結果
      </div>


      <div
        id="result"
        class="result empty"
      >
        選擇玩法後，點擊「開始分析」
      </div>

    </section>


    <div class="footer">
      趨勢資料分析僅供參考
    </div>

  </main>


  <script>

    const WORKER_URL =
      "https://xinyao-539-api.love06130430.workers.dev/";


    const TOKEN_KEY =
      "xinyao539_member_token";


    const loginView =
      document.getElementById(
        "loginView"
      );


    const loginWrap =
      document.getElementById(
        "loginWrap"
      );


    const appView =
      document.getElementById(
        "appView"
      );


    const loginForm =
      document.getElementById(
        "loginForm"
      );


    const memberAccount =
      document.getElementById(
        "memberAccount"
      );


    const loginBtn =
      document.getElementById(
        "loginBtn"
      );


    const loginMessage =
      document.getElementById(
        "loginMessage"
      );


    const memberChip =
      document.getElementById(
        "memberChip"
      );


    const logoutBtn =
      document.getElementById(
        "logoutBtn"
      );


    const playType =
      document.getElementById(
        "playType"
      );


    const missArea =
      document.getElementById(
        "missArea"
      );


    const missCount =
      document.getElementById(
        "missCount"
      );


    const analyzeBtn =
      document.getElementById(
        "analyzeBtn"
      );


    const result =
      document.getElementById(
        "result"
      );


    // =====================================
    // TOKEN
    // =====================================

    function getSavedToken() {

      return localStorage.getItem(
        TOKEN_KEY
      ) || "";

    }


    function saveToken(
      token
    ) {

      localStorage.setItem(
        TOKEN_KEY,
        token
      );

    }


    function clearToken() {

      localStorage.removeItem(
        TOKEN_KEY
      );

    }


    // =====================================
    // API
    // =====================================

    async function callAPI(
      payload,
      requireAuth = false
    ) {

      const headers = {
        "Content-Type":
          "application/json"
      };


      if (requireAuth) {

        const token =
          getSavedToken();


        if (token) {

          headers.Authorization =
            "Bearer " +
            token;

        }

      }


      const response =
        await fetch(
          WORKER_URL,
          {
            method:
              "POST",

            headers:
              headers,

            body:
              JSON.stringify(
                payload
              )
          }
        );


      let data;


      try {

        data =
          await response.json();

      } catch {

        throw new Error(
          "伺服器回傳格式錯誤"
        );

      }


      if (!response.ok) {

        const error =
          new Error(
            data?.error ||
            "系統發生錯誤"
          );


        error.status =
          response.status;


        throw error;

      }


      return data;

    }


    // =====================================
    // 顯示登入
    // =====================================

    function showLogin() {

      appView.classList.add(
        "hidden"
      );


      loginView.classList.remove(
        "hidden"
      );


      loginWrap.classList.remove(
        "login-success-animation"
      );


      loginMessage.textContent =
        "";

    }


    // =====================================
    // 顯示 APP
    // =====================================

    function showApp(
      account,
      memberName
    ) {

      loginView.classList.add(
        "hidden"
      );


      appView.classList.remove(
        "hidden"
      );


      memberChip.textContent =
        "👤 " +
        (
          memberName ||
          account ||
          "會員"
        );

    }


    // =====================================
    // 登入
    // =====================================

    loginForm.addEventListener(
      "submit",
      async event => {

        event.preventDefault();


        const account =
          memberAccount.value
            .trim()
            .toLowerCase();


        if (!account) {

          loginMessage.textContent =
            "請輸入會員帳號";

          return;

        }


        loginBtn.disabled =
          true;


        loginBtn.textContent =
          "✨ 驗證中...";


        loginMessage.classList.remove(
          "success"
        );


        loginMessage.textContent =
          "正在確認會員使用權限...";


        try {

          const data =
            await callAPI(
              {
                action:
                  "login",

                account:
                  account
              }
            );


          saveToken(
            data.token
          );


          loginMessage.classList.add(
            "success"
          );


          loginMessage.textContent =
            "✨ 登入成功";


          loginWrap.classList.add(
            "login-success-animation"
          );


          setTimeout(
            () => {

              showApp(
                data.account,
                data.member_name
              );

            },
            400
          );


        } catch (
          error
        ) {

          loginMessage.textContent =
            error.message;

        } finally {

          loginBtn.disabled =
            false;


          loginBtn.textContent =
            "✨ 登入分析系統";

        }

      }
    );


    // =====================================
    // 自動恢復登入
    // =====================================

    async function restoreSession() {

      const token =
        getSavedToken();


      if (!token) {

        showLogin();

        return;

      }


      loginMessage.textContent =
        "正在恢復登入狀態...";


      try {

        const data =
          await callAPI(
            {
              action:
                "session"
            },
            true
          );


        showApp(
          data.account,
          data.member_name
        );


      } catch {

        clearToken();

        showLogin();

      }

    }


    // =====================================
    // 登出
    // =====================================

    logoutBtn.addEventListener(
      "click",
      async () => {

        try {

          await callAPI(
            {
              action:
                "logout"
            },
            true
          );

        } catch {
          // ignore
        }


        clearToken();


        memberAccount.value =
          "";


        showLogin();

      }
    );


    // =====================================
    // 多選不中
    // =====================================

    function updateMissArea() {

      if (
        playType.value ===
        "多選不中"
      ) {

        missArea.classList.remove(
          "hidden"
        );

      } else {

        missArea.classList.add(
          "hidden"
        );

      }

    }


    playType.addEventListener(
      "change",
      updateMissArea
    );


    updateMissArea();


    // =====================================
    // HTML escape
    // =====================================

    function escapeHtml(
      text
    ) {

      return String(
        text ?? ""
      )

      .replaceAll(
        "&",
        "&amp;"
      )

      .replaceAll(
        "<",
        "&lt;"
      )

      .replaceAll(
        ">",
        "&gt;"
      )

      .replaceAll(
        '"',
        "&quot;"
      )

      .replaceAll(
        "'",
        "&#039;"
      );

    }


    // =====================================
    // 下一開獎日
    // 星期日跳過
    // =====================================

    function getNextDrawDate(
      latestDate
    ) {

      if (
        !latestDate ||
        !latestDate.includes("/")
      ) {

        return "";

      }


      const [
        month,
        day
      ] =
        latestDate
          .split("/")
          .map(Number);


      const year =
        Number(

          new Intl.DateTimeFormat(
            "en",
            {
              timeZone:
                "Asia/Taipei",

              year:
                "numeric"
            }
          )

          .format(
            new Date()
          )

        );


      const date =
        new Date(
          Date.UTC(
            year,
            month - 1,
            day
          )
        );


      do {

        date.setUTCDate(
          date.getUTCDate() + 1
        );

      } while (
        date.getUTCDay() === 0
      );


      return (

        String(
          date.getUTCMonth() + 1
        )
          .padStart(
            2,
            "0"
          )

        +

        "/"

        +

        String(
          date.getUTCDate()
        )
          .padStart(
            2,
            "0"
          )

      );

    }


    // =====================================
    // 號碼
    // =====================================

    function extractNumbers(
      text
    ) {

      return (
        String(
          text || ""
        )
        .match(
          /\b(?:0[1-9]|[12][0-9]|3[0-9])\b/g
        )
        ||
        []
      );

    }


    // =====================================
    // 球
    // =====================================

    function createBalls(
      numbers,
      small = false
    ) {

      return numbers
        .map(
          (
            number,
            index
          ) => {

            const delay =
              (
                index *
                .11
              )
              .toFixed(2);


            return (

              '<span ' +

              'class="number-ball' +

              (
                small
                  ?
                  ' small'
                  :
                  ''
              )

              +

              '" style="animation-delay:' +

              delay +

              's">' +

              escapeHtml(
                number
              ) +

              '</span>'

            );

          }
        )
        .join("");

    }


    // =====================================
    // 結果渲染
    // =====================================

    function renderAnalysis(
      analysisText,
      targetDate
    ) {

      const lines =
        String(
          analysisText || ""
        )
          .split("\n")
          .map(
            line =>
              line.trim()
          )
          .filter(Boolean);


      let html =
        '<div class="analysis-box">';


      let titleUsed =
        false;


      lines.forEach(
        line => {

          if (
            !titleUsed &&
            line.includes("【")
          ) {

            html +=
              '<div class="analysis-title">' +

              escapeHtml(
                targetDate
              ) +

              escapeHtml(
                line
              ) +

              '</div>';


            titleUsed =
              true;

            return;

          }


          if (
            line.includes("：")
          ) {

            const index =
              line.indexOf("：");


            const label =
              line.substring(
                0,
                index
              );


            const content =
              line.substring(
                index + 1
              );


            const numbers =
              extractNumbers(
                content
              );


            if (
              numbers.length >= 2
            ) {

              const small =
                !label.includes(
                  "主選5顆"
                )
                &&
                !label.includes(
                  "連碰5顆"
                );


              html +=
                '<div class="analysis-line">' +

                '<div class="analysis-label">' +

                escapeHtml(
                  label
                ) +

                '</div>' +

                '<div class="number-balls">' +

                createBalls(
                  numbers,
                  small
                ) +

                '</div>' +

                '</div>';


              return;

            }


            html +=
              '<div class="analysis-line">' +

              '<div class="analysis-label">' +

              escapeHtml(
                label
              ) +

              '</div>' +

              '<span class="text-pill">' +

              escapeHtml(
                content
              ) +

              '</span>' +

              '</div>';


            return;

          }


          const numbers =
            extractNumbers(
              line
            );


          if (
            numbers.length >= 2
          ) {

            html +=
              '<div class="analysis-line">' +

              '<div class="number-balls">' +

              createBalls(
                numbers
              ) +

              '</div>' +

              '</div>';


            return;

          }


          html +=
            '<div class="analysis-line">' +

            escapeHtml(
              line
            ) +

            '</div>';

        }
      );


      html +=
        '</div>';


      return html;

    }


    // =====================================
    // Loading
    // =====================================

    function showLoading() {

      result.classList.remove(
        "empty"
      );


      result.innerHTML =

        '<div class="loading-wrap">' +

        '<div class="loading-balls">' +

        '<span class="loading-ball"></span>' +
        '<span class="loading-ball"></span>' +
        '<span class="loading-ball"></span>' +
        '<span class="loading-ball"></span>' +
        '<span class="loading-ball"></span>' +

        '</div>' +

        '<div class="loading-text">' +

        '正在分析近期539趨勢...' +

        '</div>' +

        '</div>';

    }


    // =====================================
    // ANALYZE
    // =====================================

    analyzeBtn.addEventListener(
      "click",
      async () => {

        showLoading();


        analyzeBtn.disabled =
          true;


        analyzeBtn.textContent =
          "✨ 分析中...";


        try {

          const data =
            await callAPI(
              {

                action:
                  "analyze",

                play_type:
                  playType.value,

                miss_count:
                  playType.value ===
                  "多選不中"
                    ?
                    missCount.value
                    :
                    "5顆"

              },
              true
            );


          const latestDate =
            data.latest_date ||
            "未知";


          const latestNumbers =
            data.latest_numbers ||
            "未知";


          const targetDate =
            getNextDrawDate(
              latestDate
            );


          result.classList.remove(
            "empty"
          );


          result.innerHTML =

            '<div class="data-info">' +

            '<div class="data-row">' +

            '📅 資料基準：<strong>' +

            escapeHtml(
              latestDate
            ) +

            '</strong></div>' +

            '<div class="data-row">' +

            '🎱 最新開獎：<strong>' +

            escapeHtml(
              latestNumbers
            ) +

            '</strong></div>' +

            '<div class="data-row">' +

            '🎯 分析目標：<strong>' +

            '下一期' +

            '</strong></div>' +

            '</div>' +

            renderAnalysis(
              data.result,
              targetDate
            );


        } catch (
          error
        ) {


          if (
            error.status === 401
          ) {

            clearToken();

            showLogin();

            return;

          }


          result.classList.remove(
            "empty"
          );


          result.innerHTML =

            '<div class="error-box">' +

            '分析發生錯誤\n\n' +

            escapeHtml(
              error.message
            ) +

            '</div>';

        } finally {

          analyzeBtn.disabled =
            false;


          analyzeBtn.textContent =
            "✨ 開始分析";

        }

      }
    );


    // =====================================
    // START
    // =====================================

    restoreSession();

  </script>

</body>

</html>
