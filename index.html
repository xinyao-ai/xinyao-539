<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>芯瑤💕539趨勢分析</title>

  <link rel="icon" href="./favicon-64.png">
  <link rel="apple-touch-icon" href="./icon-192(1).png">
  <meta name="theme-color" content="#FFF1CE">

  <style>
    :root{
      --orange:#F49A32;
      --orange-dark:#DF761A;
      --gold:#FFC84F;
      --gold-light:#FFE28A;
      --cream:#FFF7E2;
      --cream-2:#FFF0CA;
      --brown:#533B2A;
      --soft:#8D6A4E;
      --white:#FFFFFF;
      --danger:#B65336;
      --shadow:0 14px 38px rgba(155,89,23,.11);
    }

    *{box-sizing:border-box}

    html,body{
      margin:0;
      padding:0;
      min-height:100%;
    }

    body{
      min-height:100vh;
      overflow-x:hidden;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;
      color:var(--brown);
      background:
        radial-gradient(circle at 15% 10%,rgba(255,210,91,.42),transparent 28%),
        radial-gradient(circle at 90% 35%,rgba(246,155,49,.20),transparent 30%),
        linear-gradient(180deg,#FFF8E7,#FFEDC9 52%,#FFF8EA);
    }

    button,input,select{font-family:inherit}
    button{touch-action:manipulation}
    .hidden{display:none!important}

    /* =========================
       背景動畫
    ========================= */
    .bg-effects{
      position:fixed;
      inset:0;
      z-index:0;
      overflow:hidden;
      pointer-events:none;
    }

    .orb{
      position:absolute;
      border-radius:50%;
      filter:blur(10px);
      animation:floatOrb 8s ease-in-out infinite alternate;
    }

    .orb.one{
      width:220px;
      height:220px;
      top:-80px;
      left:-70px;
      background:rgba(255,199,67,.35);
    }

    .orb.two{
      width:270px;
      height:270px;
      right:-120px;
      top:45%;
      background:rgba(241,139,37,.17);
      animation-delay:1.5s;
    }

    @keyframes floatOrb{
      to{transform:translate(30px,35px)}
    }

    .spark{
      position:absolute;
      width:6px;
      height:6px;
      border-radius:50%;
      background:#FFD367;
      box-shadow:0 0 13px rgba(255,183,36,.55);
      animation:sparkMove 5s ease-in-out infinite;
    }

    .spark.s1{left:8%;top:20%}
    .spark.s2{right:10%;top:15%;animation-delay:1s}
    .spark.s3{left:15%;top:72%;animation-delay:2s}
    .spark.s4{right:13%;top:70%;animation-delay:3s}

    @keyframes sparkMove{
      0%,100%{opacity:.25;transform:translateY(0) scale(.8)}
      50%{opacity:1;transform:translateY(-18px) scale(1.3)}
    }

    /* =========================
       登入
    ========================= */
    #loginView{
      position:relative;
      z-index:2;
      width:min(92%,430px);
      min-height:100vh;
      margin:auto;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:35px 0;
    }

    .login-wrap{
      width:100%;
      text-align:center;
      animation:loginIn .7s ease both;
    }

    @keyframes loginIn{
      from{opacity:0;transform:translateY(25px) scale(.96)}
      to{opacity:1;transform:translateY(0) scale(1)}
    }

    .login-wrap.login-leaving{
      animation:loginOut .46s ease forwards;
    }

    @keyframes loginOut{
      to{opacity:0;transform:translateY(-12px) scale(.97);filter:blur(2px)}
    }

    .login-logo-area{
      position:relative;
      width:145px;
      height:145px;
      margin:0 auto 6px;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .login-logo-glow{
      position:absolute;
      width:125px;
      height:125px;
      border-radius:36px;
      background:linear-gradient(135deg,#FFE28A,rgba(244,153,45,.30));
      filter:blur(8px);
      animation:pulse 2.5s ease-in-out infinite;
    }

    @keyframes pulse{
      0%,100%{transform:scale(.94);opacity:.55}
      50%{transform:scale(1.1);opacity:1}
    }

    .login-logo{
      position:relative;
      z-index:3;
      width:104px;
      height:104px;
      object-fit:cover;
      border-radius:28px;
      border:3px solid #fff;
      box-shadow:0 14px 35px rgba(173,97,24,.20);
      animation:logoFloat 3.2s ease-in-out infinite;
    }

    @keyframes logoFloat{
      0%,100%{transform:translateY(0)}
      50%{transform:translateY(-8px)}
    }

    .orbit-ball{
      position:absolute;
      width:34px;
      height:34px;
      border-radius:50%;
      display:flex;
      align-items:center;
      justify-content:center;
      color:#fff;
      font-size:12px;
      font-weight:900;
      background:radial-gradient(circle at 30% 25%,#FFE687,#F7A535 45%,#DE7419);
      border:2px solid #fff;
      box-shadow:0 6px 13px rgba(195,92,13,.22);
      animation:orbitFloat 3s ease-in-out infinite;
    }

    .orbit-ball.a{left:0;top:25px}
    .orbit-ball.b{right:0;top:12px;animation-delay:.7s}
    .orbit-ball.c{right:8px;bottom:8px;animation-delay:1.3s}

    @keyframes orbitFloat{
      50%{transform:translateY(-8px) rotate(10deg)}
    }

    .login-title{
      margin-top:4px;
      font-size:25px;
      font-weight:900;
    }

    .login-title span{color:#E98320}

    .login-sub{
      margin:6px 0 22px;
      font-size:13px;
      color:#977357;
    }

    .login-card{
      position:relative;
      overflow:hidden;
      padding:24px 22px;
      border-radius:27px;
      background:rgba(255,255,255,.91);
      border:1px solid rgba(255,202,106,.55);
      box-shadow:0 18px 45px rgba(157,91,25,.13);
      backdrop-filter:blur(14px);
      -webkit-backdrop-filter:blur(14px);
    }

    .login-card::before{
      content:"";
      position:absolute;
      width:170px;
      height:170px;
      right:-95px;
      top:-105px;
      border-radius:50%;
      background:rgba(255,207,92,.17);
    }

    .login-card-title{
      position:relative;
      text-align:left;
      margin-bottom:17px;
      font-size:17px;
      font-weight:900;
    }

    .login-label{
      position:relative;
      display:block;
      text-align:left;
      margin-bottom:8px;
      font-size:13px;
      font-weight:800;
      color:#76563E;
    }

    .input-wrap{position:relative}

    #memberAccount{
      width:100%;
      height:55px;
      padding:0 45px 0 16px;
      border:1px solid #EDD3A7;
      border-radius:16px;
      outline:none;
      background:#FFFEFA;
      color:var(--brown);
      font-size:16px;
      transition:.2s ease;
    }

    #memberAccount:focus{
      border-color:#F3A349;
      box-shadow:0 0 0 4px rgba(243,163,73,.12);
    }

    .input-icon{
      position:absolute;
      right:15px;
      top:50%;
      transform:translateY(-50%);
    }

    .shine-btn{
      position:relative;
      overflow:hidden;
      border:0;
      color:#fff;
      font-weight:900;
      background:linear-gradient(110deg,#E67919,#F6A139,#FFCA58);
      box-shadow:0 10px 25px rgba(213,111,20,.27);
      cursor:pointer;
    }

    .shine-btn::after{
      content:"";
      position:absolute;
      top:-50%;
      left:-60%;
      width:35%;
      height:200%;
      transform:rotate(20deg);
      background:linear-gradient(90deg,transparent,rgba(255,255,255,.7),transparent);
      animation:shine 3s infinite;
    }

    @keyframes shine{
      60%,100%{left:130%}
    }

    #loginBtn{
      width:100%;
      height:55px;
      margin-top:16px;
      border-radius:17px;
      font-size:16px;
      transition:transform .16s ease,opacity .16s ease;
    }

    #loginBtn:active{transform:scale(.985)}
    #loginBtn:disabled{opacity:.68;cursor:not-allowed}

    .login-message{
      min-height:23px;
      padding-top:11px;
      font-size:13px;
      color:var(--danger);
    }

    .login-message.success{color:#B8751E}

    /* =========================
       登入成功動畫
    ========================= */
    .login-success-overlay{
      position:fixed;
      inset:0;
      z-index:100;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:22px;
      background:
        radial-gradient(circle at 50% 42%,rgba(255,222,126,.38),transparent 32%),
        rgba(255,247,227,.86);
      backdrop-filter:blur(13px);
      -webkit-backdrop-filter:blur(13px);
      opacity:0;
      visibility:hidden;
      pointer-events:none;
      transition:opacity .22s ease,visibility .22s ease;
    }

    .login-success-overlay.show{
      opacity:1;
      visibility:visible;
      pointer-events:auto;
    }

    .success-card{
      position:relative;
      width:min(88vw,340px);
      text-align:center;
      padding:34px 24px 28px;
      border-radius:30px;
      background:rgba(255,255,255,.93);
      border:1px solid rgba(255,197,82,.58);
      box-shadow:0 24px 60px rgba(154,86,17,.18);
      transform:translateY(18px) scale(.92);
      opacity:0;
    }

    .login-success-overlay.show .success-card{
      animation:successCardIn .55s cubic-bezier(.18,1.25,.35,1) forwards;
    }

    @keyframes successCardIn{
      0%{opacity:0;transform:translateY(18px) scale(.9)}
      70%{opacity:1;transform:translateY(-4px) scale(1.035)}
      100%{opacity:1;transform:translateY(0) scale(1)}
    }

    .success-icon-wrap{
      position:relative;
      width:106px;
      height:106px;
      margin:0 auto 18px;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .success-ring{
      position:absolute;
      inset:8px;
      border-radius:50%;
      border:2px solid rgba(244,154,50,.36);
      opacity:0;
    }

    .success-ring.r1{animation-delay:.05s}
    .success-ring.r2{animation-delay:.22s}
    .success-ring.r3{animation-delay:.39s}

    .login-success-overlay.show .success-ring{
      animation:ringBurst 1.15s ease-out forwards;
    }

    @keyframes ringBurst{
      0%{transform:scale(.55);opacity:.75}
      100%{transform:scale(1.75);opacity:0}
    }

    .success-check{
      position:relative;
      z-index:3;
      width:78px;
      height:78px;
      border-radius:50%;
      display:flex;
      align-items:center;
      justify-content:center;
      color:#fff;
      font-size:40px;
      font-weight:1000;
      line-height:1;
      background:
        radial-gradient(circle at 30% 22%,#FFE178 0%,#F7AA35 38%,#E47718 100%);
      border:3px solid rgba(255,255,255,.95);
      box-shadow:
        inset 0 2px 7px rgba(255,255,255,.32),
        0 12px 28px rgba(212,104,13,.28);
      transform:scale(.2) rotate(-18deg);
      opacity:0;
    }

    .login-success-overlay.show .success-check{
      animation:checkPop .62s .08s cubic-bezier(.18,1.45,.35,1) forwards;
    }

    @keyframes checkPop{
      0%{opacity:0;transform:scale(.2) rotate(-18deg)}
      68%{opacity:1;transform:scale(1.15) rotate(4deg)}
      100%{opacity:1;transform:scale(1) rotate(0)}
    }

    .success-spark{
      position:absolute;
      width:8px;
      height:8px;
      border-radius:50%;
      background:#FFC84F;
      box-shadow:0 0 12px rgba(255,177,24,.7);
      opacity:0;
    }

    .success-spark.p1{left:5px;top:18px;--dx:-20px;--dy:-18px}
    .success-spark.p2{right:7px;top:15px;--dx:22px;--dy:-20px}
    .success-spark.p3{left:3px;bottom:18px;--dx:-24px;--dy:18px}
    .success-spark.p4{right:2px;bottom:22px;--dx:24px;--dy:15px}
    .success-spark.p5{left:49%;top:-2px;--dx:0px;--dy:-27px}

    .login-success-overlay.show .success-spark{
      animation:sparkBurst .72s .22s ease-out forwards;
    }

    @keyframes sparkBurst{
      0%{opacity:0;transform:translate(0,0) scale(.4)}
      40%{opacity:1}
      100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.2)}
    }

    .success-title{
      font-size:21px;
      font-weight:950;
      color:#513825;
      margin-bottom:7px;
      opacity:0;
      transform:translateY(6px);
    }

    .success-account{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-height:32px;
      padding:6px 13px;
      border-radius:999px;
      background:#FFF0C9;
      color:#D3731B;
      font-size:13px;
      font-weight:900;
      opacity:0;
      transform:translateY(6px);
    }

    .success-loading{
      margin-top:14px;
      color:#967052;
      font-size:12px;
      opacity:0;
    }

    .login-success-overlay.show .success-title{
      animation:successTextIn .4s .34s ease forwards;
    }

    .login-success-overlay.show .success-account{
      animation:successTextIn .4s .42s ease forwards;
    }

    .login-success-overlay.show .success-loading{
      animation:successTextIn .4s .50s ease forwards;
    }

    @keyframes successTextIn{
      to{opacity:1;transform:translateY(0)}
    }

    .success-dots{
      display:inline-flex;
      gap:4px;
      margin-left:5px;
      vertical-align:middle;
    }

    .success-dots i{
      width:4px;
      height:4px;
      border-radius:50%;
      background:#D8832A;
      animation:successDot .9s ease-in-out infinite;
    }

    .success-dots i:nth-child(2){animation-delay:.12s}
    .success-dots i:nth-child(3){animation-delay:.24s}

    @keyframes successDot{
      0%,100%{transform:translateY(0);opacity:.35}
      50%{transform:translateY(-3px);opacity:1}
    }

    /* =========================
       APP
    ========================= */
    #appView{
      position:relative;
      z-index:2;
      width:min(92%,520px);
      margin:auto;
      padding:26px 0 60px;
    }

    #appView.app-entering{
      animation:appIn .58s cubic-bezier(.2,.9,.3,1) both;
    }

    @keyframes appIn{
      from{opacity:0;transform:translateY(18px) scale(.985)}
      to{opacity:1;transform:translateY(0) scale(1)}
    }

    .topbar{
      display:flex;
      align-items:center;
      justify-content:flex-end;
      flex-wrap:wrap;
      gap:7px;
      margin-bottom:12px;
    }

    .member-chip,.top-btn{
      padding:7px 11px;
      border-radius:999px;
      border:0;
      font-size:11px;
    }

    .member-chip{
      background:rgba(255,255,255,.82);
      color:#805E43;
    }

    .top-btn{
      background:#FFE6B3;
      color:#A85E1F;
      font-weight:800;
      cursor:pointer;
    }

    .header{
      text-align:center;
      margin-bottom:25px;
    }

    .app-logo{
      width:95px;
      height:95px;
      object-fit:cover;
      border-radius:25px;
      border:3px solid white;
      box-shadow:0 12px 30px rgba(172,95,24,.18);
      animation:logoFloat 3.4s ease-in-out infinite;
    }

    h1{
      margin:10px 0 0;
      font-size:24px;
      font-weight:900;
    }

    .highlight{color:#E98421}

    .sub{
      margin-top:8px;
      color:#947256;
      font-size:13px;
      line-height:1.6;
    }

    .card{
      padding:21px;
      margin-bottom:17px;
      border-radius:24px;
      border:1px solid rgba(255,201,106,.5);
      background:rgba(255,255,255,.91);
      box-shadow:var(--shadow);
      backdrop-filter:blur(12px);
      -webkit-backdrop-filter:blur(12px);
    }

    .card label{
      display:block;
      margin-bottom:8px;
      font-size:14px;
      font-weight:900;
    }

    select{
      width:100%;
      height:52px;
      padding:0 14px;
      border:1px solid #EFD5A8;
      border-radius:15px;
      outline:none;
      background:white;
      color:var(--brown);
      font-size:16px;
    }

    select:focus{
      border-color:#F3A349;
      box-shadow:0 0 0 4px rgba(243,163,73,.10);
    }

    #missArea{margin-top:17px}

    #analyzeBtn{
      width:100%;
      height:55px;
      margin-top:19px;
      border-radius:17px;
      font-size:17px;
    }

    #analyzeBtn:disabled{opacity:.68;cursor:not-allowed}

    .result-title{
      margin-bottom:13px;
      font-size:17px;
      font-weight:900;
    }

    .result{
      padding:16px;
      border-radius:18px;
      border:1px solid rgba(244,160,48,.22);
      background:linear-gradient(145deg,#FFFEFA,#FFF6DF);
      line-height:1.7;
      min-height:0;
      word-break:break-word;
    }

    .result.empty{
      padding:23px 15px;
      text-align:center;
      color:#987960;
      font-size:13px;
    }

    .data-info{
      margin-bottom:16px;
      padding:11px 13px;
      border-radius:14px;
      background:linear-gradient(135deg,#FFF0C8,#FFF8E7);
      font-size:14px;
      animation:reveal .4s ease both;
    }

    .data-row{margin-bottom:4px}
    .data-row:last-child{margin-bottom:0}

    .analysis-box{animation:reveal .48s ease both}

    @keyframes reveal{
      from{opacity:0;transform:translateY(8px)}
      to{opacity:1;transform:translateY(0)}
    }

    .analysis-title{
      margin-bottom:12px;
      font-size:17px;
      font-weight:900;
      color:#553B27;
    }

    .analysis-line{margin-top:14px}

    .analysis-label{
      margin-bottom:7px;
      color:#805E46;
      font-size:13px;
      font-weight:800;
    }

    .number-balls{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
    }

    .number-ball{
      width:47px;
      height:47px;
      border-radius:50%;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      color:white;
      font-size:17px;
      font-weight:900;
      border:2px solid white;
      background:radial-gradient(circle at 30% 25%,#FFDF78,#F7AA35 40%,#E67819 80%);
      box-shadow:0 7px 15px rgba(202,96,13,.22);
      opacity:0;
      transform:translateY(13px) scale(.65);
      animation:ballPop .45s cubic-bezier(.22,1.35,.5,1) forwards;
    }

    .number-ball.small{
      width:39px;
      height:39px;
      color:#65451F;
      font-size:14px;
      background:radial-gradient(circle at 30% 25%,#FFF0A7,#FFCA58,#EE9E36);
    }

    @keyframes ballPop{
      70%{opacity:1;transform:translateY(-4px) scale(1.08)}
      100%{opacity:1;transform:translateY(0) scale(1)}
    }

    .text-pill{
      display:inline-flex;
      padding:7px 12px;
      border-radius:999px;
      background:#FFF0C8;
      color:#CE6E17;
      font-weight:900;
    }

    .loading-wrap{
      text-align:center;
      padding:6px 0;
    }

    .loading-balls{
      display:flex;
      justify-content:center;
      gap:7px;
    }

    .loading-ball{
      width:15px;
      height:15px;
      border-radius:50%;
      background:linear-gradient(135deg,#FFC755,#E98221);
      animation:loading .9s ease-in-out infinite;
    }

    .loading-ball:nth-child(2){animation-delay:.1s}
    .loading-ball:nth-child(3){animation-delay:.2s}
    .loading-ball:nth-child(4){animation-delay:.3s}
    .loading-ball:nth-child(5){animation-delay:.4s}

    @keyframes loading{
      0%,100%{transform:translateY(0)}
      50%{transform:translateY(-9px)}
    }

    .loading-text{
      margin-top:10px;
      color:#967153;
      font-size:13px;
    }

    .error-box{
      color:var(--danger);
      white-space:pre-line;
      font-size:13px;
    }

    .footer{
      margin-top:25px;
      text-align:center;
      color:#A88666;
      font-size:11px;
    }

    /* =========================
       分析紀錄
    ========================= */
    .history-modal{
      position:fixed;
      inset:0;
      z-index:50;
      display:flex;
      align-items:flex-end;
      justify-content:center;
      padding:18px;
      background:rgba(61,42,26,.35);
      opacity:0;
      visibility:hidden;
      transition:opacity .25s ease,visibility .25s ease;
    }

    .history-modal.open{
      opacity:1;
      visibility:visible;
    }

    .history-panel{
      width:min(100%,520px);
      max-height:82vh;
      display:flex;
      flex-direction:column;
      border-radius:27px 27px 20px 20px;
      background:linear-gradient(180deg,#FFFDF7,#FFF4D9);
      border:1px solid rgba(255,196,88,.55);
      box-shadow:0 20px 55px rgba(92,52,16,.24);
      transform:translateY(40px);
      transition:transform .3s cubic-bezier(.2,.9,.3,1);
    }

    .history-modal.open .history-panel{
      transform:translateY(0);
    }

    .history-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:8px;
      padding:18px 18px 13px;
      border-bottom:1px solid #F4D9A9;
    }

    .history-title{
      font-size:18px;
      font-weight:900;
    }

    .history-actions{
      display:flex;
      gap:7px;
    }

    .history-action{
      border:0;
      padding:7px 10px;
      border-radius:999px;
      background:#FFE6B3;
      color:#9E591F;
      font-size:11px;
      font-weight:800;
      cursor:pointer;
    }

    .history-list{
      overflow-y:auto;
      padding:14px 16px 24px;
    }

    .history-empty{
      padding:42px 12px;
      text-align:center;
      color:#98785E;
      font-size:13px;
    }

    .history-card{
      padding:15px;

  <script>
    const WORKER_URL =
      "https://xinyao-539-api.love06130430.workers.dev/";

    const TOKEN_KEY =
      "xinyao539_member_token";

    const loginView =
      document.getElementById("loginView");

    const loginWrap =
      document.getElementById("loginWrap");

    const loginForm =
      document.getElementById("loginForm");

    const memberAccount =
      document.getElementById("memberAccount");

    const loginBtn =
      document.getElementById("loginBtn");

    const loginMessage =
      document.getElementById("loginMessage");

    const loginSuccessOverlay =
      document.getElementById("loginSuccessOverlay");

    const successAccount =
      document.getElementById("successAccount");

    const appView =
      document.getElementById("appView");

    const memberChip =
      document.getElementById("memberChip");

    const historyBtn =
      document.getElementById("historyBtn");

    const logoutBtn =
      document.getElementById("logoutBtn");

    const playType =
      document.getElementById("playType");

    const missArea =
      document.getElementById("missArea");

    const missCount =
      document.getElementById("missCount");

    const analyzeBtn =
      document.getElementById("analyzeBtn");

    const result =
      document.getElementById("result");

    const historyModal =
      document.getElementById("historyModal");

    const historyList =
      document.getElementById("historyList");

    const clearHistoryBtn =
      document.getElementById("clearHistoryBtn");

    const closeHistoryBtn =
      document.getElementById("closeHistoryBtn");


    /* =========================
       Token
    ========================= */

    function getSavedToken(){
      return localStorage.getItem(TOKEN_KEY) || "";
    }

    function saveToken(token){
      localStorage.setItem(TOKEN_KEY,token);
    }

    function clearToken(){
      localStorage.removeItem(TOKEN_KEY);
    }


    /* =========================
       API
    ========================= */

    async function callAPI(payload,requireAuth=false){
      const headers={
        "Content-Type":"application/json"
      };

      if(requireAuth){
        const token=getSavedToken();

        if(token){
          headers.Authorization=
            "Bearer " + token;
        }
      }

      const response=
        await fetch(
          WORKER_URL,
          {
            method:"POST",
            headers,
            body:JSON.stringify(payload)
          }
        );

      let data;

      try{
        data=await response.json();
      }catch{
        throw new Error(
          "伺服器回傳格式錯誤"
        );
      }

      if(!response.ok){
        const error=
          new Error(
            data?.error ||
            "系統發生錯誤"
          );

        error.status=
          response.status;

        throw error;
      }

      return data;
    }


    /* =========================
       View
    ========================= */

    function resetLoginAnimation(){
      loginWrap.classList.remove(
        "login-leaving"
      );

      loginSuccessOverlay.classList.remove(
        "show"
      );

      loginSuccessOverlay.setAttribute(
        "aria-hidden",
        "true"
      );
    }

    function showLogin(){
      appView.classList.add(
        "hidden"
      );

      appView.classList.remove(
        "app-entering"
      );

      resetLoginAnimation();

      loginView.classList.remove(
        "hidden"
      );

      loginMessage.classList.remove(
        "success"
      );

      loginMessage.textContent="";
    }

    function showApp(account,name,animate=true){
      loginView.classList.add(
        "hidden"
      );

      memberChip.textContent=
        "👤 " +
        (
          name ||
          account ||
          "會員"
        );

      appView.classList.remove(
        "hidden"
      );

      appView.classList.remove(
        "app-entering"
      );

      if(animate){
        void appView.offsetWidth;

        appView.classList.add(
          "app-entering"
        );
      }
    }


    /* =========================
       登入成功動畫
    ========================= */

    function playLoginSuccess(
      account,
      memberName
    ){
      return new Promise(resolve=>{

        successAccount.textContent=
          memberName ||
          account ||
          "會員";

        loginMessage.classList.add(
          "success"
        );

        loginMessage.textContent=
          "✓ 驗證成功";

        loginBtn.textContent=
          "✓ 驗證成功";

        loginWrap.classList.add(
          "login-leaving"
        );

        loginSuccessOverlay.classList.add(
          "show"
        );

        loginSuccessOverlay.setAttribute(
          "aria-hidden",
          "false"
        );

        window.setTimeout(
          ()=>{
            loginView.classList.add(
              "hidden"
            );

            showApp(
              account,
              memberName,
              true
            );
          },
          920
        );

        window.setTimeout(
          ()=>{
            loginSuccessOverlay.classList.remove(
              "show"
            );

            loginSuccessOverlay.setAttribute(
              "aria-hidden",
              "true"
            );

            loginWrap.classList.remove(
              "login-leaving"
            );

            resolve();
          },
          1450
        );

      });
    }


    /* =========================
       Login
    ========================= */

    loginForm.addEventListener(
      "submit",
      async event=>{

        event.preventDefault();

        const account=
          memberAccount.value
            .trim()
            .toLowerCase();

        if(!account){
          loginMessage.classList.remove(
            "success"
          );

          loginMessage.textContent=
            "請輸入會員帳號";

          return;
        }

        loginBtn.disabled=true;
        loginBtn.textContent=
          "✨ 驗證中...";

        loginMessage.classList.remove(
          "success"
        );

        loginMessage.textContent=
          "正在確認會員使用權限...";

        try{
          const data=
            await callAPI({
              action:"login",
              account
            });

          saveToken(
            data.token
          );

          await playLoginSuccess(
            data.account,
            data.member_name
          );

        }catch(error){
          loginMessage.classList.remove(
            "success"
          );

          loginMessage.textContent=
            error.message;

        }finally{
          loginBtn.disabled=false;
          loginBtn.textContent=
            "✨ 登入分析系統";
        }
      }
    );


    /* =========================
       Session
       已登入重新整理時不重播成功動畫
    ========================= */

    async function restoreSession(){
      if(!getSavedToken()){
        showLogin();
        return;
      }

      try{
        const data=
          await callAPI(
            {
              action:"session"
            },
            true
          );

        showApp(
          data.account,
          data.member_name,
          false
        );

      }catch{
        clearToken();
        showLogin();
      }
    }


    /* =========================
       Logout
    ========================= */

    logoutBtn.addEventListener(
      "click",
      async ()=>{

        try{
          await callAPI(
            {
              action:"logout"
            },
            true
          );
        }catch{}

        clearToken();

        historyModal.classList.remove(
          "open"
        );

        memberAccount.value="";

        showLogin();
      }
    );


    /* =========================
       多選不中
    ========================= */

    function updateMissArea(){
      if(
        playType.value ===
        "多選不中"
      ){
        missArea.classList.remove(
          "hidden"
        );
      }else{
        missArea.classList.add(
          "hidden"
        );
      }
    }

    playType.addEventListener(
      "change",
      updateMissArea
    );

    updateMissArea();


    /* =========================
       Escape
    ========================= */

    function escapeHtml(text){
      return String(text ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }


    /* =========================
       下一期日期
       星期日自動跳過
    ========================= */

    function getNextDrawDate(
      latestDate
    ){
      if(
        !latestDate ||
        !latestDate.includes("/")
      ){
        return "";
      }

      const [month,day]=
        latestDate
          .split("/")
          .map(Number);

      const year=
        Number(
          new Intl.DateTimeFormat(
            "en",
            {
              timeZone:"Asia/Taipei",
              year:"numeric"
            }
          ).format(new Date())
        );

      const date=
        new Date(
          Date.UTC(
            year,
            month-1,
            day
          )
        );

      do{
        date.setUTCDate(
          date.getUTCDate()+1
        );
      }while(
        date.getUTCDay() === 0
      );

      return (
        String(
          date.getUTCMonth()+1
        ).padStart(2,"0")
        +
        "/"
        +
        String(
          date.getUTCDate()
        ).padStart(2,"0")
      );
    }


    /* =========================
       號碼球
    ========================= */

    function extractNumbers(text){
      return (
        String(text || "")
          .match(
            /\b(?:0[1-9]|[12][0-9]|3[0-9])\b/g
          )
        ||
        []
      );
    }

    function createBalls(
      numbers,
      small=false
    ){
      return numbers
        .map(
          (number,index)=>(
            '<span class="number-ball' +
            (
              small
                ? ' small'
                : ''
            ) +
            '" style="animation-delay:' +
            (
              index*.11
            ).toFixed(2) +
            's">' +
            escapeHtml(number) +
            '</span>'
          )
        )
        .join("");
    }


    /* =========================
       分析結果渲染
    ========================= */

    function renderAnalysis(
      analysisText,
      targetDate
    ){
      const lines=
        String(
          analysisText || ""
        )
          .split("\n")
          .map(line=>line.trim())
          .filter(Boolean);

      let html=
        '<div class="analysis-box">';

      let titleUsed=false;

      lines.forEach(line=>{

        if(
          !titleUsed &&
          line.includes("【")
        ){
          html+=
            '<div class="analysis-title">' +
            escapeHtml(targetDate) +
            escapeHtml(line) +
            '</div>';

          titleUsed=true;
          return;
        }

        if(
          line.includes("：")
        ){
          const index=
            line.indexOf("：");

          const label=
            line.substring(0,index);

          const content=
            line.substring(index+1);

          const numbers=
            extractNumbers(content);

          if(
            numbers.length >= 2
          ){
            const small=
              !label.includes(
                "主選5顆"
              )
              &&
              !label.includes(
                "連碰5顆"
              );

            html+=
              '<div class="analysis-line">' +
                '<div class="analysis-label">' +
                  escapeHtml(label) +
                '</div>' +
                '<div class="number-balls">' +
                  createBalls(
                    numbers,
                    small
                  ) +
                '</div>' +
              '</div>';

            return;
          }

          html+=
            '<div class="analysis-line">' +
              '<div class="analysis-label">' +
                escapeHtml(label) +
              '</div>' +
              '<span class="text-pill">' +
                escapeHtml(content) +
              '</span>' +
            '</div>';

          return;
        }

        const numbers=
          extractNumbers(line);

        if(
          numbers.length >= 2
        ){
          html+=
            '<div class="analysis-line">' +
              '<div class="number-balls">' +
                createBalls(numbers) +
              '</div>' +
            '</div>';

          return;
        }

        html+=
          '<div class="analysis-line">' +
            escapeHtml(line) +
          '</div>';
      });

      html+='</div>';

      return html;
    }


    /* =========================
       Loading
    ========================= */

    function showLoading(){
      result.classList.remove(
        "empty"
      );

      result.innerHTML=
        '<div class="loading-wrap">' +
          '<div class="loading-balls">' +
            '<span class="loading-ball"></span>' +
            '<span class="loading-ball"></span>' +
            '<span class="loading-ball"></span>' +
            '<span class="loading-ball"></span>' +
            '<span class="loading-ball"></span>' +
          '</div>' +
          '<div class="loading-text">' +
            '正在分析近期539趨勢...' +
          '</div>' +
        '</div>';
    }


    /* =========================
       Analyze
    ========================= */

    analyzeBtn.addEventListener(
      "click",
      async ()=>{

        showLoading();

        analyzeBtn.disabled=true;
        analyzeBtn.textContent=
          "✨ 分析中...";

        try{
          const data=
            await callAPI(
              {
                action:"analyze",
                play_type:
                  playType.value,
                miss_count:
                  playType.value ===
                  "多選不中"
                    ? missCount.value
                    : "5顆"
              },
              true
            );

          const latestDate=
            data.latest_date ||
            "未知";

          const latestNumbers=
            data.latest_numbers ||
            "未知";

          const targetDate=
            getNextDrawDate(
              latestDate
            );

          result.classList.remove(
            "empty"
          );

          result.innerHTML=
            '<div class="data-info">' +

              '<div class="data-row">' +
                '📅 資料基準：<strong>' +
                escapeHtml(
                  latestDate
                ) +
                '</strong>' +
              '</div>' +

              '<div class="data-row">' +
                '🎱 最新開獎：<strong>' +
                escapeHtml(
                  latestNumbers
                ) +
                '</strong>' +
              '</div>' +

              '<div class="data-row">' +
                '🎯 分析目標：<strong>下一期</strong>' +
              '</div>' +

            '</div>' +

            renderAnalysis(
              data.result,
              targetDate
            );

        }catch(error){

          if(
            error.status === 401
          ){
            clearToken();
            showLogin();
            return;
          }

          result.classList.remove(
            "empty"
          );

          result.innerHTML=
            '<div class="error-box">' +
              escapeHtml(
                error.message
              ) +
            '</div>';

        }finally{
          analyzeBtn.disabled=false;
          analyzeBtn.textContent=
            "✨ 開始分析";
        }
      }
    );


    /* =========================
       History
    ========================= */

    function renderHistory(history){
      if(
        !Array.isArray(history) ||
        history.length === 0
      ){
        historyList.innerHTML=
          '<div class="history-empty">' +
            '目前還沒有分析紀錄 🍊' +
          '</div>';

        return;
      }

      historyList.innerHTML=
        history
          .map(
            (item,index)=>{

              const targetDate=
                getNextDrawDate(
                  item.latest_date
                );

              const missText=
                item.play_type ===
                "多選不中"
                  ? " " +
                    (
                      item.miss_count ||
                      ""
                    )
                  : "";

              return (
                '<div ' +
                'class="history-card" ' +
                'style="animation-delay:' +
                (
                  index*.04
                ).toFixed(2) +
                's">' +

                  '<div class="history-card-title">' +
                    escapeHtml(
                      targetDate
                    ) +
                    '｜' +
                    escapeHtml(
                      item.play_type
                    ) +
                    escapeHtml(
                      missText
                    ) +
                  '</div>' +

                  '<div class="history-meta">' +
                    '📅 資料基準：' +
                    escapeHtml(
                      item.latest_date ||
                      ""
                    ) +
                    '<br>' +
                    '🎱 最新開獎：' +
                    escapeHtml(
                      item.latest_numbers ||
                      ""
                    ) +
                  '</div>' +

                  '<div class="history-result">' +
                    escapeHtml(
                      item.result ||
                      ""
                    ) +
                  '</div>' +

                '</div>'
              );
            }
          )
          .join("");
    }

    async function loadHistory(){
      historyList.innerHTML=
        '<div class="history-empty">' +
          '正在載入分析紀錄...' +
        '</div>';

      try{
        const data=
          await callAPI(
            {
              action:"history"
            },
            true
          );

        renderHistory(
          data.history
        );

      }catch(error){

        if(
          error.status === 401
        ){
          historyModal.classList.remove(
            "open"
          );

          clearToken();
          showLogin();
          return;
        }

        historyList.innerHTML=
          '<div class="history-empty">' +
            escapeHtml(
              error.message
            ) +
          '</div>';
      }
    }

    historyBtn.addEventListener(
      "click",
      async ()=>{
        historyModal.classList.add(
          "open"
        );

        await loadHistory();
      }
    );

    closeHistoryBtn.addEventListener(
      "click",
      ()=>{
        historyModal.classList.remove(
          "open"
        );
      }
    );

    historyModal.addEventListener(
      "click",
      event=>{
        if(
          event.target ===
          historyModal
        ){
          historyModal.classList.remove(
            "open"
          );
        }
      }
    );

    clearHistoryBtn.addEventListener(
      "click",
      async ()=>{

        const ok=
          confirm(
            "確定要清除全部分析紀錄嗎？"
          );

        if(!ok){
          return;
        }

        try{
          await callAPI(
            {
              action:"clear_history"
            },
            true
          );

          renderHistory([]);

        }catch(error){

          if(
            error.status === 401
          ){
            historyModal.classList.remove(
              "open"
            );

            clearToken();
            showLogin();
            return;
          }

          alert(
            error.message
          );
        }
      }
    );


    /* =========================
       Start
    ========================= */

    restoreSession();
  </script>

</body>
</html>
