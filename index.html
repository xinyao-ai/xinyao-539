<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>芯瑤💕539趨勢分析</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(180deg, #fff7fb 0%, #f8f4ff 100%);
      color: #352d3d;
      min-height: 100vh;
    }

    .app {
      width: min(92%, 520px);
      margin: 0 auto;
      padding: 38px 0 60px;
    }

    .header {
      text-align: center;
      margin-bottom: 28px;
    }

    .logo {
      font-size: 48px;
      margin-bottom: 8px;
    }

    h1 {
      font-size: 24px;
      margin: 0;
    }

    .sub {
      margin-top: 8px;
      font-size: 14px;
      color: #8b7f91;
      line-height: 1.6;
    }

    .card {
      background: rgba(255, 255, 255, 0.94);
      border-radius: 24px;
      padding: 22px;
      box-shadow: 0 10px 30px rgba(80, 50, 100, 0.08);
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-weight: 700;
      margin-bottom: 8px;
      font-size: 15px;
    }

    select {
      width: 100%;
      height: 50px;
      border-radius: 14px;
      border: 1px solid #e5dceb;
      background: #fff;
      padding: 0 14px;
      font-size: 16px;
      color: #352d3d;
      margin-bottom: 18px;
      outline: none;
    }

    button {
      width: 100%;
      height: 52px;
      border: 0;
      border-radius: 16px;
      background: linear-gradient(135deg, #f58ab6, #a98af5);
      color: white;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(181, 119, 214, 0.25);
    }

    button:active {
      transform: scale(0.99);
    }

    .result-title {
      font-weight: 800;
      font-size: 17px;
      margin-bottom: 14px;
    }

    .result {
      white-space: pre-line;
      line-height: 1.8;
      font-size: 16px;
      background: #faf7fd;
      border-radius: 16px;
      padding: 16px;
      color: #55485f;
    }

    .hidden {
      display: none;
    }

    .footer {
      text-align: center;
      font-size: 12px;
      color: #a49aa8;
      margin-top: 24px;
    }
  </style>
</head>

<body>
  <main class="app">

    <section class="header">
      <div class="logo">🤖</div>
      <h1>芯瑤💕539趨勢分析</h1>
      <div class="sub">
        依照個人抓牌板路與歷史趨勢進行系統化分析
      </div>
    </section>

    <section class="card">
      <label for="playType">選擇分析玩法</label>

      <select id="playType">
        <option value="連碰234星">連碰234星</option>
        <option value="全車">全車</option>
        <option value="尾數">尾數</option>
        <option value="多選不中">多選不中</option>
      </select>

      <div id="missArea" class="hidden">
        <label for="missCount">多選不中顆數</label>

        <select id="missCount">
          <option value="5顆">5顆</option>
          <option value="6顆">6顆</option>
          <option value="7顆">7顆</option>
          <option value="8顆">8顆</option>
          <option value="9顆">9顆</option>
          <option value="10顆">10顆</option>
        </select>
      </div>

      <button id="analyzeBtn">開始分析</button>
    </section>

    <section class="card">
      <div class="result-title">分析結果</div>

      <div id="result" class="result">
        請先選擇玩法並點擊「開始分析」
      </div>
    </section>

    <div class="footer">
      本工具為趨勢資料分析參考
    </div>

  </main>

  <script>
    const playType = document.getElementById("playType");
    const missArea = document.getElementById("missArea");
    const missCount = document.getElementById("missCount");
    const analyzeBtn = document.getElementById("analyzeBtn");
    const result = document.getElementById("result");

    playType.addEventListener("change", () => {
      if (playType.value === "多選不中") {
        missArea.classList.remove("hidden");
      } else {
        missArea.classList.add("hidden");
      }
    });

    analyzeBtn.addEventListener("click", () => {
      result.textContent = "正在分析中...\n\n下一步接上 Dify API 後，這裡就會顯示真正結果。";
    });
  </script>
</body>
</html>
